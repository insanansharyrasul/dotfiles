[org/gnome/desktop/interface]
clock-show-date=true
clock-show-seconds=true
clock-show-weekday=false
color-scheme='prefer-dark'
cursor-size=32
cursor-theme='Bibata-Modern-Classic'
document-font-name='Ubuntu Medium 11'
enable-hot-corners=false
font-antialiasing='grayscale'
font-hinting='full'
font-name='jetbrains mono nerd font 12'
gtk-enable-primary-paste=true
gtk-im-module='gtk-im-context-simple'
gtk-key-theme='Default'
gtk-theme='ayu-dark'
icon-theme='Papirus-Dark'
locate-pointer=false
monospace-font-name='FiraCode Nerd Font Mono weight=453 11'
scaling-factor=uint32 2
show-battery-percentage=true
text-scaling-factor=1.0
toolkit-accessibility=false

[org/gnome/desktop/wm/preferences]
action-middle-click-titlebar='lower'
button-layout=':minimize,maximize,close'
focus-mode='click'
resize-with-right-button=true
theme='Sweet-Dark'
titlebar-font='Ubuntu Medium 11'
visual-bell=false
visual-bell-type='fullscreen-flash'

[org/gtk/settings/file-chooser]
date-format='regular'
location-mode='path-bar'
show-hidden=false
show-size-column=true
show-type-column=true
sidebar-width=196
sort-column='modified'
sort-directories-first=true
sort-order='descending'
type-format='category'
window-position=(0, 0)
window-size=(914, 689)

[org/gtk/gtk4/settings/file-chooser]
date-format='regular'
location-mode='path-bar'
show-hidden=false
show-size-column=true
show-type-column=true
sidebar-width=144
sort-column='modified'
sort-directories-first=true
sort-order='descending'
type-format='category'
view-type='list'
window-size=(856, 379)

[org/nemo/preferences]
click-double-parent-folder=true
default-folder-viewer='icon-view'
default-sort-in-reverse-order=false
default-sort-order='type'
enable-delete=false
inherit-show-thumbnails=true
quick-renames-with-pause-in-between=true
show-advanced-permissions=false
show-directory-item-counts='local-only'
show-edit-icon-toolbar=true
show-full-path-titles=false
show-hidden-files=false
show-icon-view-icon-toolbar=true
show-image-thumbnails='always'
show-location-entry=false
show-places-in-to-menus=true
show-reload-icon-toolbar=false
show-search-icon-toolbar=true
show-up-icon-toolbar=false
thumbnail-limit=uint64 1073741824

[org/nemo/preferences/menu-config]
selection-menu-duplicate=true

[org/cinnamon/desktop/applications/terminal]
exec='alacritty'

