general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = brightnessctl -sd asus::kbd_backlight set 0; hyprlock
    after_sleep_cmd = brightnessctl -rd asus::kbd_backlight; hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 300
    on-timeout = hyprlock
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 600
    on-timeout = systemctl suspend
}
